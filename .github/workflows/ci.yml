name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ios:
    name: Сборка iOS
    # macOS-раннер — единственное место, где существует iOS SDK.
    # Минуты macOS списываются с коэффициентом x10, поэтому джоб один и короткий.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Версия Xcode
        run: xcodebuild -version

      - name: Сборка приложения
        working-directory: FamilyTasks.swiftpm
        # CODE_SIGNING_ALLOWED=NO — нам нужна только компиляция,
        # сертификаты на этом этапе не требуются.
        # destination намеренно generic: набор симуляторов на раннере меняется
        # (сейчас там iOS 26 и iPhone Air), и привязка к модели уже ломала сборку.
        # derivedDataPath задан, чтобы следующий шаг нашёл собранный .app.
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme FamilyTasks \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO

      - name: Скриншоты из симулятора
        working-directory: FamilyTasks.swiftpm
        # Симулятором без UI-тестов нельзя «потыкать», зато можно запустить
        # приложение несколько раз с разными аргументами и снять по кадру.
        run: |
          set -eo pipefail
          mkdir -p shots

          APP=$(find dd/Build/Products -maxdepth 3 -name "FamilyTasks.app" | head -1)
          echo "Приложение: $APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "Bundle id: $BUNDLE_ID"

          # Модель не фиксируем: набор симуляторов на раннере со временем меняется.
          # Берём первый доступный iPhone и запоминаем его имя для названия артефакта.
          read UDID DEVICE < <(xcrun simctl list devices available --json | python3 -c "
import json, sys
devices = json.load(sys.stdin)['devices']
phones = [d for runtime in devices.values() for d in runtime if d['name'].startswith('iPhone')]
if not phones:
    sys.exit('Симуляторов iPhone на раннере не нашлось')
print(phones[0]['udid'], phones[0]['name'])
")
          echo "Симулятор: $DEVICE ($UDID)"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"

          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"

          for SCREEN in login tasks notes family profile; do
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -screen "$SCREEN"
            # Пауза на восстановление сессии и первую загрузку из мока.
            sleep 5
            xcrun simctl io "$UDID" screenshot "shots/$SCREEN.png"
            echo "снято: $SCREEN"
          done

          xcrun simctl shutdown "$UDID"

      - name: Выложить скриншоты
        # if: always() — кадры полезны и когда что-то упало на середине.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Экраны приложения
          path: FamilyTasks.swiftpm/shots/*.png
          if-no-files-found: warn

  backend:
    name: Тесты бэкенда
    # Linux-минуты идут 1:1, так что этот джоб практически бесплатный.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Зависимости
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Линтер
        working-directory: backend
        run: ruff check .

      - name: Тесты
        working-directory: backend
        run: pytest -q

      - name: Миграции накатываются и откатываются
        working-directory: backend
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db
        run: |
          alembic upgrade head
          alembic downgrade base
